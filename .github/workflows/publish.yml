name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Upgrade npm for trusted publishing (requires >=11.5)
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version ${PACKAGE_VERSION} already published, skipping."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version ${PACKAGE_VERSION} not yet published."
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.published == 'false'
        run: npm publish --access public --provenance

      - name: Verify publish
        if: steps.version-check.outputs.published == 'false'
        run: |
          echo "Waiting for npm registry to propagate..."
          PACKAGE_NAME="${{ steps.version-check.outputs.name }}"
          PACKAGE_VERSION="${{ steps.version-check.outputs.version }}"

          for i in 1 2 3 4 5 6; do
            sleep 10
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
              echo "Verified: ${PACKAGE_NAME}@${PACKAGE_VERSION} is live on npm"
              exit 0
            fi
            echo "Attempt $i: not yet visible, retrying..."
          done

          echo "::warning::Package published but not yet visible on npm registry after 60s. It may take a few more minutes to propagate."

      - name: Tag release
        if: steps.version-check.outputs.published == 'false'
        run: |
          git tag "v${{ steps.version-check.outputs.version }}"
          git push origin "v${{ steps.version-check.outputs.version }}"
