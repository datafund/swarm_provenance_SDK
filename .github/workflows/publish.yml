name: Publish to npm

on:
  push:
    branches: [main]

# Jobs get read-only access unless they set their own permissions.
permissions:
  contents: read

jobs:
  # The ci.yml matrix: Node 18.x and 20.x, and the @x402 2.23.0 and 2.28.0
  # payment tests. It runs for this commit and with read-only access.
  ci:
    uses: ./.github/workflows/ci.yml

  # The gitleaks scan of the pushed range, with read-only access.
  # secret-scan.yml does not run on its own for a push to main.
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  publish:
    # Publish only if the full ci.yml matrix and the secret scan passed for
    # this commit.
    needs: [ci, secret-scan]
    runs-on: ubuntu-latest

    # Only one publish job runs at a time. The group is on this job, not on
    # the workflow, so the matrix and the scan still run for every push.
    # The group does not keep push order: a job joins it only after its own
    # matrix and scan finish. So the job publishes and tags only if its commit
    # is still the tip of main (the tip-check step below). An older push that
    # reaches the group late is skipped and cannot move npm `latest` back (#188).
    # By default, GitHub keeps at most one pending job per group: a newer
    # pending job cancels the older pending one, even with cancel-in-progress
    # false. The cancelled job belongs to an older commit, which the tip check
    # would skip anyway, so `queue: max` is not used (#187).
    concurrency:
      group: npm-publish
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version ${PACKAGE_VERSION} already published, skipping."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version ${PACKAGE_VERSION} not yet published."
          fi

      # Run as late as possible, right before publishing, so the answer is
      # current. If a newer commit is on main, skip publish and tag: that
      # commit's own run publishes. Fail if the tip cannot be read.
      - name: Check that this commit is still the tip of main
        id: tip-check
        if: steps.version-check.outputs.published == 'false'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TIP_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$TIP_SHA" ]; then
            echo "::error::Could not read the tip of main from origin."
            exit 1
          fi
          if [ "$TIP_SHA" = "$COMMIT_SHA" ]; then
            echo "tip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${COMMIT_SHA} is the tip of main, publishing."
          else
            echo "tip=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish and tag: a newer commit (${TIP_SHA}) is on main; its own run publishes."
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.published == 'false' && steps.tip-check.outputs.tip == 'true'
        run: npm publish --access public --provenance

      - name: Verify publish
        if: steps.version-check.outputs.published == 'false' && steps.tip-check.outputs.tip == 'true'
        run: |
          echo "Waiting for npm registry to propagate..."
          PACKAGE_NAME="${{ steps.version-check.outputs.name }}"
          PACKAGE_VERSION="${{ steps.version-check.outputs.version }}"

          for i in 1 2 3 4 5 6; do
            sleep 10
            if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
              echo "Verified: ${PACKAGE_NAME}@${PACKAGE_VERSION} is live on npm"
              exit 0
            fi
            echo "Attempt $i: not yet visible, retrying..."
          done

          echo "::warning::Package published but not yet visible on npm registry after 60s. It may take a few more minutes to propagate."

      - name: Tag release
        if: steps.version-check.outputs.published == 'false' && steps.tip-check.outputs.tip == 'true'
        run: |
          git tag "v${{ steps.version-check.outputs.version }}"
          git push origin "v${{ steps.version-check.outputs.version }}"
