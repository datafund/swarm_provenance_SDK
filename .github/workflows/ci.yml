name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/chain/index.js
          test -f dist/chain/index.cjs
          test -f dist/chain/index.d.ts

      - name: Payment policy on the newest tested @x402 (peer range upper bound)
        run: |
          # The lockfile pins @x402 2.5.0 (lower bound); 2.23+ adds a default $1 spend cap
          # the policy must override (#110). Keep in sync with peerDependencies.
          pnpm add -D @x402/fetch@2.28.0 @x402/evm@2.28.0
          pnpm vitest run tests/unit/x402-policy.test.ts tests/unit/payment.test.ts
          git checkout -- package.json pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Verify viem guard (CJS chain entry, #99)
        run: |
          # viem present: the CJS chain entry loads
          node -e "if (typeof require('./dist/chain/index.cjs').ChainClient !== 'function') process.exit(1)"
          # viem absent (dist copied outside node_modules' reach): actionable message
          mkdir -p "$RUNNER_TEMP/noviem" && cp -r dist "$RUNNER_TEMP/noviem/"
          node -e "try { require(process.argv[1]); console.error('expected a throw'); process.exit(1) } catch (e) { if (!e.message.includes('npm install viem')) { console.error(e.message); process.exit(1) } }" "$RUNNER_TEMP/noviem/dist/chain/index.cjs"
          # bundled with viem inlined: loads with no node_modules at runtime
          echo "require('$GITHUB_WORKSPACE/dist/chain/index.cjs').ChainClient.name" > "$RUNNER_TEMP/entry.cjs"
          mkdir -p "$RUNNER_TEMP/bundle"
          # esbuild is not a direct devDependency; use the copy tsup depends on
          node -e "const esbuild = require(require.resolve('esbuild', { paths: [require.resolve('tsup')] })); esbuild.buildSync({ entryPoints: [process.argv[1]], bundle: true, platform: 'node', outfile: process.argv[2], logLevel: 'error' })" "$RUNNER_TEMP/entry.cjs" "$RUNNER_TEMP/bundle/out.cjs"
          (cd "$RUNNER_TEMP/bundle" && node out.cjs)
