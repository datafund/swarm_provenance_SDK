name: CI

on:
  # A push to main runs this workflow through publish.yml (workflow_call),
  # so it is not listed here. This runs the matrix once per push to main.
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  # publish.yml calls this workflow and publishes only if it passes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/chain/index.js
          test -f dist/chain/index.cjs
          test -f dist/chain/index.d.ts
          test -f dist/chain/browser.js
          test -f dist/chain/browser.cjs
          test -f dist/chain/browser.d.ts
          test -f dist/chain/browser.d.cts
          # The browser build has no fromPrivateKey, in code or types (#123)
          for f in browser.js browser.cjs browser.d.ts browser.d.cts; do
            if grep -q fromPrivateKey "dist/chain/$f"; then echo "dist/chain/$f mentions fromPrivateKey"; exit 1; fi
          done
          # The viem guard (#99) is applied to both CJS chain entries (#123)
          grep -qF "npm install viem" dist/chain/index.cjs
          grep -qF "npm install viem" dist/chain/browser.cjs
          # Chain errors are instanceof the main entry's ProvenanceError, ESM and CJS (#205)
          node scripts/verify-dist-instanceof.mjs

      - name: Payment policy across the tested @x402 range
        run: |
          # The lockfile pins @x402 2.5.0 (lower bound). 2.23.0 is the first with the
          # default $1 spend cap the policy must override (#110); 2.28.0 is the upper
          # bound. Keep in sync with peerDependencies.
          for v in 2.23.0 2.28.0; do
            pnpm add -D @x402/fetch@$v @x402/evm@$v
            pnpm vitest run tests/unit/x402-policy.test.ts tests/unit/payment.test.ts tests/unit/idempotency.test.ts tests/unit/payment-receipt.test.ts
          done
          git checkout -- package.json pnpm-lock.yaml
          pnpm install --frozen-lockfile

      - name: Verify viem guard (CJS chain entry, #99)
        run: |
          # viem present: the CJS chain entry loads
          node -e "if (typeof require('./dist/chain/index.cjs').ChainClient !== 'function') process.exit(1)"
          # viem absent (dist copied outside node_modules' reach): actionable message
          mkdir -p "$RUNNER_TEMP/noviem" && cp -r dist "$RUNNER_TEMP/noviem/"
          for entry in index browser; do
            node -e "try { require(process.argv[1]); console.error('expected a throw'); process.exit(1) } catch (e) { if (!e.message.includes('npm install viem')) { console.error(e.message); process.exit(1) } }" "$RUNNER_TEMP/noviem/dist/chain/$entry.cjs"
          done
          # bundled with viem inlined: loads with no node_modules at runtime, and a
          # chain error is still instanceof the main entry's ProvenanceError (#205)
          cat > "$RUNNER_TEMP/entry.cjs" <<EOF
          const { ProvenanceError, StampError } = require('$GITHUB_WORKSPACE/dist/index.cjs');
          const { ChainClient } = require('$GITHUB_WORKSPACE/dist/chain/index.cjs');
          try { new ChainClient({ chain: 'nope' }); } catch (e) {
            if (e instanceof ProvenanceError && !(e instanceof StampError)) process.exit(0);
          }
          console.error('bundled: chain error is not instanceof ProvenanceError');
          process.exit(1);
          EOF
          mkdir -p "$RUNNER_TEMP/bundle"
          # esbuild is not a direct devDependency; use the copy tsup depends on
          node -e "const esbuild = require(require.resolve('esbuild', { paths: [require.resolve('tsup')] })); esbuild.buildSync({ entryPoints: [process.argv[1]], bundle: true, platform: 'node', outfile: process.argv[2], logLevel: 'error' })" "$RUNNER_TEMP/entry.cjs" "$RUNNER_TEMP/bundle/out.cjs"
          (cd "$RUNNER_TEMP/bundle" && node out.cjs)
